<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>HB-Lab</title>
    <script>
      (function () {
        var host = location.hostname.toLowerCase();
        if (host.indexOf("studio") === -1) return;
        var title = "HB Studio";
        var description = "Film, photography, podcasts, and live coverage from HB Studio, a product of HBLab.";
        document.title = title;
        document.documentElement.dataset.siteTitle = title;
        var tags = {
          "meta[property='og:title']": title,
          "meta[name='twitter:title']": title,
          "meta[property='og:description']": description,
          "meta[name='twitter:description']": description,
          "meta[property='og:url']": "https://studio.hblab.rw/"
        };
        Object.keys(tags).forEach(function (selector) {
          var node = document.querySelector(selector);
          if (node) node.setAttribute("content", tags[selector]);
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo-icon.png" />

    <!-- Open Graph Meta Tags for social media sharing -->
    <meta property="og:title" content="HB-Lab" />
    <meta property="og:description" content="Empowering the Next Generation of Tech Professionals with HB Lab." />
    <meta property="og:image" content="https://umuhuza.store/assets/bg3-BlDRNqe_.jpg" />
    <meta property="og:url" content="https://hblab.rw/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HB-Lab" />
    <meta name="twitter:description" content="Empowering the Next Generation of Tech Professionals with HB Lab." />
    <meta name="twitter:image" content="https://umuhuza.store/assets/bg3-BlDRNqe_.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
